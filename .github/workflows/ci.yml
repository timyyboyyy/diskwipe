name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 nsis testdisk mtools dosfstools python3
      - name: Linux-Tests (Unit + Integration)
        run: make test
      - name: Windows-Testprogramm bauen
        run: make build/diskwipe_tests.exe
      - name: Exe und Installer bauen
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: windows-tests
          path: build/diskwipe_tests.exe

  test-windows:
    needs: build-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-tests
          path: build
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Unit-Tests unter Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/tmp | Out-Null
          ./build/diskwipe_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer-Test
        shell: pwsh
        run: ./tests/win/installer-test.ps1 -Dist dist
